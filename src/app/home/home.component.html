<mat-card>
  <h2>User Details</h2>
  <mat-form-field style="width: 50%;">
    <mat-label>Search users...</mat-label>
    <input matInput [(ngModel)]="filterValue" (keyup)="applyFilter()" />
  </mat-form-field>
  
  <table mat-table [dataSource]="dataSource || []" class="mat-elevation-z8">
  
    <!-- ID Column -->
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef> ID </th>
      <td mat-cell *matCellDef="let row; let i = index">
        {{ users!.at(i).get('id')?.value }}
      </td>
    </ng-container>
  
    <!-- Name Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Name </th>
      <td mat-cell *matCellDef="let row; let i = index">
        <ng-container *ngIf="!users.at(i).get('isEditable')?.value; else editName">
          {{ users!.at(i).get('name')?.value }}
        </ng-container>
        <ng-template #editName>
          <input matInput [formControl]="getFormControl(i, 'name')" />
        </ng-template>
      </td>
    </ng-container>
  
    <!-- Username Column -->
    <ng-container matColumnDef="username">
      <th mat-header-cell *matHeaderCellDef> Username </th>
      <td mat-cell *matCellDef="let row; let i = index">
        <ng-container *ngIf="!users.at(i).get('isEditable')?.value; else editUsername">
          {{ users!.at(i).get('username')?.value }}
        </ng-container>
        <ng-template #editUsername>
          <input matInput [formControl]="getFormControl(i, 'username')" />
        </ng-template>
      </td>
    </ng-container>
  
    <!-- Email Column -->
    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef> Email </th>
      <td mat-cell *matCellDef="let row; let i = index">
        <ng-container *ngIf="!users.at(i).get('isEditable')?.value; else editEmail">
          {{ users!.at(i).get('email')?.value }}
        </ng-container>
        <ng-template #editEmail>
          <input matInput [formControl]="getFormControl(i, 'email')" />
        </ng-template>
      </td>
    </ng-container>
  
    <!-- Actions Column -->
    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef> Actions </th>
      <td mat-cell *matCellDef="let row; let i = index">
        <ng-container *ngIf="!users.at(i).get('isEditable')?.value; else editActions">
          <button mat-button color="primary" (click)="editRow(i)">Edit</button>
        </ng-container>
        <ng-template #editActions>
          <button mat-button color="accent" (click)="saveRow(i)">Save</button>
          <button mat-button color="warn" (click)="cancelEdit(i)">Cancel</button>
        </ng-template>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  
    <!-- Row shown when there is no matching data. -->
    <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" colspan="4">
            No data matching the filter {{filterValue}}
          </td>
      </tr>
  </table>
</mat-card>
